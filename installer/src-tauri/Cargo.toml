[package]
name = "questlog-setup"
version = "0.3.9"
description = "Questlog Setup — instalador visual"
authors = ["Questlog"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "questlog_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
