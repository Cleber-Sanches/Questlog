# Build + GitHub Release + latest.json (updater do Tauri).
# Disparo: tag vX.Y.Z (ex.: v0.3.2) ou Actions → Release → Run workflow.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY — conteúdo inteiro de keys/questlog.key
#   Preferível (preserva quebras de linha):
#     gh secret set TAURI_SIGNING_PRIVATE_KEY < keys/questlog.key
#
# A chave local é --ci (senha vazia). Não precisa de secret de senha.
#
# Também: Settings → Actions → General → Workflow permissions → Read and write.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "Tag v$tag não bate com package.json ($pkg). Suba a versão antes de taguear."
          }
          if ($tag -ne $tauri) {
            throw "Tag v$tag não bate com tauri.conf.json ($tauri)."
          }
          Write-Host "Versão ok: $tag"

      - name: Prepare updater signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            throw @"
          Secret TAURI_SIGNING_PRIVATE_KEY não está configurado.
          No PC (na pasta do repo):
            gh secret set TAURI_SIGNING_PRIVATE_KEY < keys/questlog.key
          "@
          }

          $raw = $env:KEY.Trim()
          # Se colaram com \n literais no GitHub UI, normaliza.
          if ($raw -notmatch '(?m)^untrusted comment:') {
            $raw = $raw -replace '\\n', "`n"
          }
          if ($raw -notmatch '(?m)^untrusted comment:') {
            throw @"
          Chave inválida: falta a linha 'untrusted comment:'.
          Cole o arquivo keys/questlog.key INTEIRO, sem aspas.
          Comando seguro:
            gh secret set TAURI_SIGNING_PRIVATE_KEY < keys/questlog.key
          "@
          }

          $path = Join-Path $env:RUNNER_TEMP 'questlog.key'
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($path, ($raw.TrimEnd() + "`n"), $utf8)
          "TAURI_SIGNING_PRIVATE_KEY_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Chave de assinatura ok (arquivo temporário)."

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Evita o target-dir absoluto do .cargo/config.toml (só faz sentido na máquina local).
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          # Senha vazia: chave gerada com tauri signer generate --ci
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Questlog __VERSION__
          releaseBody: |
            Instalador Windows (NSIS) assinado para o updater.

            O app busca atualizações em:
            `https://github.com/Cleber-Sanches/Questlog/releases/latest/download/latest.json`
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          generateReleaseNotes: true
