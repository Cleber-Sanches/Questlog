# Build + GitHub Release + latest.json (updater do Tauri).
# Disparo: tag vX.Y.Z (ex.: v0.3.2) ou Actions → Release → Run workflow.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          — conteúdo de keys/questlog.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — vazio se a chave foi gerada com --ci
#
# Também: Settings → Actions → General → Workflow permissions → Read and write.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "Tag v$tag não bate com package.json ($pkg). Suba a versão antes de taguear."
          }
          if ($tag -ne $tauri) {
            throw "Tag v$tag não bate com tauri.conf.json ($tauri)."
          }
          Write-Host "Versão ok: $tag"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Evita o target-dir absoluto do .cargo/config.toml (só faz sentido na máquina local).
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Questlog __VERSION__
          releaseBody: |
            Instalador Windows (NSIS) assinado para o updater.

            O app busca atualizações em:
            `https://github.com/Cleber-Sanches/Questlog/releases/latest/download/latest.json`
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          generateReleaseNotes: true
