# Build + GitHub Release + latest.json (updater do Tauri).
# Disparo: tag vX.Y.Z (ex.: v0.3.9) ou Actions → Release → Run workflow.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY — conteúdo inteiro de keys/questlog.key
#   Preferível (preserva quebras de linha):
#     gh secret set TAURI_SIGNING_PRIVATE_KEY < keys/questlog.key
#
# A chave local é --ci (senha vazia). Não precisa de secret de senha.
#
# Também: Settings → Actions → General → Workflow permissions → Read and write.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "Tag v$tag não bate com package.json ($pkg). Suba a versão antes de taguear."
          }
          if ($tag -ne $tauri) {
            throw "Tag v$tag não bate com tauri.conf.json ($tauri)."
          }
          Write-Host "Versão ok: $tag"

      - name: Prepare updater signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            throw @"
          Secret TAURI_SIGNING_PRIVATE_KEY não está configurado.
          No PC (na pasta do repo):
            Get-Content -Raw keys/trophydesk.key | gh secret set TAURI_SIGNING_PRIVATE_KEY
          "@
          }

          $raw = $env:KEY.Trim().Trim('"').Trim("'")
          if ($raw -match '\\n') {
            $raw = $raw -replace '\\n', "`n"
          }

          $ok = $raw -match '(?m)^untrusted comment:'
          if (-not $ok) {
            try {
              $decoded = [System.Text.Encoding]::UTF8.GetString(
                [Convert]::FromBase64String(($raw -replace '\s', ''))
              )
              $ok = $decoded -match '(?m)^untrusted comment:'
              if ($ok) { Write-Host "Secret em base64 válido." }
            } catch {
              $ok = $false
            }
          }

          if (-not $ok) {
            throw @"
          Chave inválida: falta 'untrusted comment:' (texto ou base64 do keys/*.key).
          Comando:
            Get-Content -Raw keys/trophydesk.key | gh secret set TAURI_SIGNING_PRIVATE_KEY
          "@
          }

          Write-Host "Chave de assinatura ok."

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Evita o target-dir absoluto do .cargo/config.toml (só faz sentido na máquina local).
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          # Conteúdo do keys/*.key (base64 ou texto minisign). Senha vazia = --ci.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Questlog __VERSION__
          releaseBody: |
            ## Download
            Use **Questlog-Setup.exe** (instalador visual).

            O NSIS (`Questlog_*_x64-setup.exe`) continua no release para o updater automático.

            O app busca atualizações em:
            `https://github.com/Cleber-Sanches/Questlog/releases/latest/download/latest.json`
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          generateReleaseNotes: true

      - name: Build Questlog-Setup.exe
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/setup-target
          QUESTLOG_NSIS_DIR: ${{ github.workspace }}/target/release/bundle/nsis
        run: |
          Push-Location installer
          npm ci
          Pop-Location
          powershell -ExecutionPolicy Bypass -File tools/build-questlog-setup.ps1 -SkipAppBuild
          if (-not (Test-Path "dist-setup\Questlog-Setup.exe")) {
            throw "dist-setup/Questlog-Setup.exe não foi gerado."
          }

      - name: Upload Questlog-Setup.exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          gh release upload $tag "dist-setup/Questlog-Setup.exe" --clobber
          Write-Host "Uploaded Questlog-Setup.exe to $tag"
